name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalación de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Inicializar y compilar APK con Bubblewrap
        run: |
          mkdir -p android-project
          
          # La bandera --yes responde "Sí" automáticamente a los prompts interactivos
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=android-project --yes
          
          cd android-project
          
          # Generar keystore sin prompts (--batch)
          keytool -genkey -v -keystore android.keystore -alias androiddb -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CamApp, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # Compilar la APK usando las variables de entorno JDK/SDK globales de la Action
          bubblewrap build --yes

      - name: Guardar APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-project/*.apk
