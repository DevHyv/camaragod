
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalación de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configurar Entorno de Bubblewrap (Evitar prompts JDK/SDK)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\", \"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Inicializar y compilar APK con Bubblewrap
        run: |
          mkdir -p android-project
          
          # Extraer dinámicamente el nombre de usuario y repositorio
          REPO_NAME=$(basename ${{ github.repository }})
          OWNER=${{ github.repository_owner }}
          
          # Generar la URL de GitHub Pages
          MANIFEST_URL="https://$OWNER.github.io/$REPO_NAME/manifest.json"
          echo "Compilando APK apuntando a: $MANIFEST_URL"
          
          # "yes """ presiona Enter automáticamente a preguntas de Dominio o Path
          yes "" | bubblewrap init --manifest="$MANIFEST_URL" --directory=android-project
          
          cd android-project
          
          # Generar keystore silenciosamente
          keytool -genkey -v -keystore android.keystore -alias androiddb -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CamApp, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # Construir la APK final (aceptando términos y condiciones si los pide)
          yes "" | bubblewrap build

      - name: Guardar APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-project/*.apk
