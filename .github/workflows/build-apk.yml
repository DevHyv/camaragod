name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Corregido: Uso estricto de Java 17 como lo requiere Bubblewrap
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalación de Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configurar Entorno de Bubblewrap (Bypass Prompts)
        run: |
          mkdir -p ~/.bubblewrap
          # Le decimos a Bubblewrap dónde está el JDK 17 y el Android SDK para que no pregunte
          echo "{\"jdkPath\":\"$JAVA_HOME\", \"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Inicializar y compilar APK con Bubblewrap
        run: |
          mkdir -p android-project
          
          # Inicializar proyecto
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=android-project
          
          cd android-project
          
          # Generar keystore de firma sin interacciones
          keytool -genkey -v -keystore android.keystore -alias androiddb -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CamApp, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          # Construir la APK final
          bubblewrap build

      - name: Guardar APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-project/*.apk
