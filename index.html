<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara HD Pro (PNG)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }
        .btn-capture {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
            outline: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn-capture:active {
            transform: scale(0.9);
            background-color: #ddd;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="controls">
            <button class="btn-capture" id="capture-btn" aria-label="Tomar foto PNG"></button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');

        // Configuración para solicitar la máxima resolución de la cámara trasera
        const constraints = {
            audio: false,
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 3840, max: 7680 },   // Resoluciones 4K/8K
                height: { ideal: 2160, max: 4320 },
                focusMode: { ideal: "continuous" },
                whiteBalance: { ideal: "continuous" },
                exposureMode: { ideal: "continuous" }
            }
        };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara en alta resolución.");
            }
        }

        // Tomar foto y guardar en formato .PNG sin pérdidas
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth) return;

            // Ajustar el canvas a las dimensiones nativas exactas del flujo de video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const context = canvas.getContext('2d');
            
            // Garantizar máxima precisión en el procesamiento del canvas
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            
            // Dibujar el fotograma actual
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Exportar como PNG (formato sin pérdida de calidad)
            const imageUrl = canvas.toDataURL('image/png');
            
            // Descargar el archivo con extensión .png
            const a = document.createElement('a');
            a.href = imageUrl;
            a.download = `photo_${Date.now()}.png`;
            a.click();
        });

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
